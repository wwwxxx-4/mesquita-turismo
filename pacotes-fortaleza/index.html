.contagem { color: var(--tinta-2); font-size: 14px; }
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px; margin-top: 18px; }
.card { background: var(--folha); border: 1px solid var(--linha); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.foto { position: relative; aspect-ratio: 16 / 9; background: var(--azul-bg); max-width: 100%; }
.foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
.foto .leg { position: absolute; left: 10px; bottom: 10px; background: rgba(0, 0, 0, .55); color: #fff; font-size: 12px; border-radius: 999px; padding: 3px 10px; }
.foto .ult { position: absolute; right: 10px; top: 10px; background: var(--alerta); color: #fff; font: 700 13px var(--cond); letter-spacing: .06em; text-transform: uppercase; border-radius: 6px; padding: 4px 8px; }
.corpo { padding: 14px 16px 16px; display: grid; gap: 10px; flex: 1; }
.corpo h2 { font: 800 30px/1 var(--cond); margin: 0; color: var(--noite); }
.rota { color: var(--tinta-2); font-size: 14px; }
.voo { font-size: 14px; display: grid; gap: 2px; }

.precos { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px dashed var(--linha); padding-top: 10px; margin-top: auto; }
.google { font-size: 13px; color: var(--tinta-2); }
.google s { font-weight: 600; text-decoration-color: #E1483B; text-decoration-thickness: 2px; }
.google .q { display: block; font-size: 12px; }
.preco { font: 800 40px/1 var(--cond); color: var(--azul); }
.preco small { font-size: 20px; margin-right: 3px; }
.det { font-size: 12px; color: var(--tinta-2); }
.parc { font-size: 13px; color: var(--tinta); margin-top: 3px; }
.parc b { font-weight: 700; }
.eco { background: var(--verde-bg); color: var(--verde); font: 700 15px var(--txt); border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
.quero-rot { font: 700 13px var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--tinta-2); text-align: center; }
.quero { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.quero a { display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; background: var(--azul); color: #fff; font-weight: 700; border-radius: 10px; padding: 10px 8px; }

.quero svg { width: 16px; height: 16px; fill: currentColor; flex: none; }

"16:20","voltaSai":"11:55","voltaChega":"16:50","idaTipo":"1 Parada","voltaTipo":"1 Parada","preco":3769,"montar":4194,"googleVoo":1600,"hotelPorPessoa":2594,"economia":425,"economiaPct":10},{"origem":"BEL","cidade":"Belém","ida":"2026-10-23","volta":"2026-10-29","noites":6,"lugares":10,"prazo":"2026-10-19","hotel":"Villa Mayor","regime":"Café da Manhã Incluso","cia":"LATAM","idaSai":"04:25","idaChega":"13:00","voltaSai":"14:00","voltaChega":"23:15","idaTipo":"1 Parada","voltaTipo":"1 Parada","preco":2589,"montar":2882,"googleVoo":1017,"hotelPorPessoa":1865,"economia":293,"economiaPct":10},{"origem":"CNF","cidade":"Belo Horizonte","ida":"2026-12-03","volta":"2026-12-09","noites":6,"lugares":10,"prazo":"2026-11-27","hotel":"Villa Mayor","regime":"Café da Manhã Incluso","cia":"GOL","idaSai":"11:55","idaChega":"16:20","voltaSai":"11:55","voltaChega":"16:35","idaTipo":"1 Parada","voltaTipo":"1 Parada","preco":2409,"montar":2681,"googleVoo":989,"hotelPorPessoa":1692,"economia":272,"economiaPct":10}],"fotos":{"Carppa Hotel":{"arquivo":"/pacotes-fortaleza/fotos/hotel-carppa-hotel.jpg","legenda":"Carppa Hotel · divulgação"},"Villa Mayor":{"arquivo":"/pacotes-fortaleza/fotos/hotel-villa-mayor.jpg","legenda":"Villa Mayor · divulgação"},"Carmel Magna Praia Hotel":{"arquivo":"/pacotes-fortaleza/fotos/hotel-carmel-magna-praia-hotel.jpg","legenda":"Carmel Magna Praia Hotel · divulgação"}},"fotoCidade":{"arquivo":"/pacotes-fortaleza/fotos/fortaleza.jpg","legenda":"Fortaleza · Praia de Iracema"},"creditos":["Fortaleza (Praia de Iracema): Jade Queiroz - MTUR, via Wikimedia Commons"],"atendentes":[{"nome":"Wester","numero":"5511953967095","exibicao":"(11) 95396-7095"},{"nome":"Bruno","numero":"5511981104018","exibicao":"(11) 98110-4018"}],"parcelas":6};
const ZAP = '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.2-.7-2.7-1.1-4.4-3.8-4.5-4-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .6l-.4.6-.3.4c.1.2.6 1 1.3 1.6.9.8 1.6 1 1.8 1.1.2.1.4.1.5-.1l.7-.9c.2-.2.4-.2.6-.1l1.9.9c.2.1.4.2.4.3.1.1.1.6-.1 1.2z"/></svg>';
const ATENDENTES = DADOS.atendentes;
const PARCELAS = DADOS.parcelas;
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const NOME_MES = { '10': 'Outubro', '11': 'Novembro', '12': 'Dezembro', '01': 'Janeiro', '02': 'Fevereiro' };
const ORDEM_MES = (m) => (Number(m) < 6 ? Number(m) + 12 : Number(m)); // janeiro depois de dezembro
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const reais = (v) => Math.round(v).toLocaleString('pt-BR');
const dia = (iso) => `${Number(iso.slice(8, 10))} ${MESES[Number(iso.slice(5, 7)) - 1]}`;
const escala = (t) => (t && !/^direto$/i.test(t) ? ` (${esc(t.toLowerCase())})` : '');
const ddmm = (iso) => `${iso.slice(8, 10)}/${iso.slice(5, 7)}`;
const linkWhats = (numero, texto) => `https://wa.me/${numero}?text=${encodeURIComponent(texto)}`;
const centavos = (v) => v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const ofertas = DADOS.ofertas.map((o, i) => ({ ...o, ordem: i, mes: o.ida.slice(5, 7) }));
document.getElementById('atendentes').innerHTML = ATENDENTES.map((a) => `<a class="btn-whats" href="${linkWhats(a.numero, `Olá, ${a.nome}! Vi os pacotes para Fortaleza no site da Mesquita Turismo e quero mais informações.`)}" target="_blank" rel="noopener">${ZAP}${esc(a.nome)} <small class="tab">${esc(a.exibicao)}</small></a>`).join('');
const meses = [...new Set(ofertas.map((o) => o.mes))].sort((a, b) => ORDEM_MES(a) - ORDEM_MES(b));
const nCidades = new Set(ofertas.map((o) => o.origem)).size;
document.getElementById('sub').textContent = `${ofertas.length} ${ofertas.length === 1 ? 'pacote' : 'pacotes'} com aéreo e hotel saindo de ${nCidades === 1 ? ofertas[0].cidade : `${nCidades} cidades`}, com preço por pessoa em apartamento duplo e já com as taxas, em até ${PARCELAS}x sem juros ou à vista no Pix. Comparados com o mesmo hotel no Booking mais o menor voo do Google Voos, nas mesmas datas, consultados em ${DADOS.consultado}.`;

const estado = { hotel: 'todos', mes: 'todos', origem: 'todas' };
function chips(id, chave, opcoes) {
  const el = document.getElementById(id);
  for (const [valor, rotulo] of opcoes) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = rotulo; b.dataset.v = valor;
    b.setAttribute('aria-pressed', String(estado[chave] === valor));
    b.addEventListener('click', () => { estado[chave] = valor; el.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.v === valor))); desenhar(); });
    el.appendChild(b);
  }
}
chips('f-origem', 'origem', [['todas', 'Todas'], ...[...new Map(ofertas.map((o) => [o.origem, o.cidade])).entries()].map(([k, v]) => [k, v])]);
chips('f-mes', 'mes', [['todos', 'Todos'], ...meses.map((m) => [m, NOME_MES[m] || m])]);
chips('f-hotel', 'hotel', [['todos', 'Todos'], ...[...new Set(ofertas.map((o) => o.hotel))].map((h) => [h, h])]);
document.getElementById('ordem').addEventListener('change', desenhar);

function card(o) {
  const foto = DADOS.fotos[o.hotel] || DADOS.fotoCidade;
  const texto = (nome) => `Olá, ${nome}! Quero o pacote para Fortaleza saindo de ${o.cidade} (${o.origem}), ${ddmm(o.ida)} a ${ddmm(o.volta)}, ${o.noites} noites no ${o.hotel}, por R$ ${reais(o.preco)} por pessoa (oferta do site).`;
  return `<article class="card">
    <div class="foto">${foto ? `<img src="${esc(foto.arquivo)}" alt="${esc(foto.legenda)}" loading="lazy"><span class="leg">${esc(foto.legenda)}</span>` : ''}${o.lugares <= 9 ? '<span class="ult">Últimos lugares</span>' : ''}</div>
    <div class="corpo">
      <div><h2>Fortaleza</h2><div class="rota">saindo de ${esc(o.cidade)} (${esc(o.origem)})</div></div>
      <div class="voo tab"><div><b>${dia(o.ida)} → ${dia(o.volta)}</b> · ${o.noites} noites</div><div><b>${esc(o.hotel)}</b>${o.regime ? ` · ${esc(o.regime)}` : ''}</div><div>${esc(o.cia)} · ida ${esc(o.idaSai)} → ${esc(o.idaChega)}${escala(o.idaTipo)} · volta ${esc(o.voltaSai)} → ${esc(o.voltaChega)}${escala(o.voltaTipo)}</div></div>
      <div class="precos">
        <div><div class="google">Montando sozinho: <s class="tab">R$ ${reais(o.montar)}</s><span class="q tab">voo R$ ${reais(o.googleVoo)} (Google Voos) + hotel R$ ${reais(o.hotelPorPessoa)} (Booking)</span></div><div class="preco tab"><small>R$</small>${reais(o.preco)}</div><div class="det">por pessoa em apto duplo · com taxas${o.prazo ? ` · reserve até ${ddmm(o.prazo)}` : ""}</div><div class="parc tab"><b>${PARCELAS}x de R$ ${centavos(o.preco / PARCELAS)}</b> sem juros ou à vista no Pix</div></div>
        <span class="eco tab">Economize R$ ${reais(o.economia)}</span>
      </div>
      <div class="quero-rot">Quero este pacote · fale com</div>
      <div class="quero">${ATENDENTES.map((a) => `<a href="${linkWhats(a.numero, texto(a.nome))}" target="_blank" rel="noopener">${ZAP}${esc(a.nome)}</a>`).join('')}</div>
    </div>
  </article>`;
}

function desenhar() {
  const ordem = document.getElementById('ordem').value;
  const lista = ofertas.filter((o) => (estado.hotel === 'todos' || o.hotel === estado.hotel) && (estado.mes === 'todos' || o.mes === estado.mes) && (estado.origem === 'todas' || o.origem === estado.origem));
  lista.sort({ destaque: (a, b) => a.ordem - b.ordem, economia: (a, b) => b.economia - a.economia, preco: (a, b) => a.preco - b.preco, data: (a, b) => a.ida.localeCompare(b.ida) }[ordem]);
  document.getElementById('grade').innerHTML = lista.map(card).join('');
  document.getElementById('vazio').hidden = lista.length > 0;
  document.getElementById('contagem').textContent = `${lista.length} de ${ofertas.length} pacotes`;
}
desenhar();

document.getElementById('rodape').innerHTML = `
  <div>Preços por pessoa em apartamento duplo, com aéreo ida e volta, hospedagem e taxas, consultados em ${esc(DADOS.consultado)}. Pagamento em até ${PARCELAS}x sem juros ou à vista no Pix, pelo mesmo preço. Sujeitos a disponibilidade e alteração até a emissão. Regras da tarifa confirmadas no atendimento.</div>
  <div>"Montando sozinho" = menor preço de ida e volta por adulto exibido no Google Voos para as mesmas datas e aeroportos + o mesmo hotel no Booking, para 2 adultos, dividido por pessoa, na data da consulta. Google e Booking são marcas de seus donos, sem relação com a Mesquita Turismo. Fotos dos hotéis: divulgação.</div>
  <details><summary>Créditos das fotos</summary><ul>${DADOS.creditos.map((c) => `<li>${esc(c)}</li>`).join('')}</ul></details>
  <div>Mesquita Turismo · WhatsApp ${ATENDENTES.map((a) => `${esc(a.nome)} ${esc(a.exibicao)}`).join(' · ')}</div>`;
</script>
</body>
