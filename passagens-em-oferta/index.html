<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Vitrine publica de passagens. Cores do logo (dois azuis); o amarelo-ouro
   e so do preco; verde e so da economia. Um tema claro, de proposito: e a
   pagina da marca, igual em qualquer aparelho. */
:root {
  --azul: #1072B9; --azul-claro: #55B5E5; --azul-bg: #EAF5FC; --noite: #0B2440;
  --papel: #F5F8FB; --folha: #FFFFFF; --tinta: #10233B; --tinta-2: #55657C; --linha: #DCE5EE;
  --ouro: #E8A600; --verde: #138A55; --verde-bg: #E3F5EC; --alerta: #C2410C; --alerta-bg: #FFF1E6;
  --cond: 'Barlow Condensed', 'Arial Narrow', sans-serif; --txt: 'Barlow', 'Segoe UI', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--papel); color: var(--tinta); font: 16px/1.5 var(--txt); }
a { color: inherit; }
.tab { font-variant-numeric: tabular-nums; }
.topo { position: sticky; top: 0; z-index: 10; background: var(--folha); border-bottom: 1px solid var(--linha); padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px; }
.topo .in { max-width: 1160px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.topo img { height: 44px; display: block; }
.atendentes { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.btn-whats { display: inline-flex; align-items: center; gap: 8px; background: #1FAF38; color: #fff; text-decoration: none; font-weight: 700; border-radius: 999px; padding: 8px 14px; white-space: nowrap; font-size: 15px; }
.btn-whats small { font-weight: 500; opacity: .92; }
.btn-whats svg { width: 18px; height: 18px; fill: currentColor; }
.pagina { max-width: 1160px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; }
.hero h1 { font: 800 clamp(34px, 6vw, 58px)/1 var(--cond); margin: 0; text-wrap: balance; color: var(--noite); }
.hero h1 em { font-style: normal; color: var(--azul); }
.hero p { color: var(--tinta-2); margin: 10px 0 0; max-width: 70ch; }
.filtros { display: grid; gap: 10px; margin-top: 22px; }
.linha-f { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.linha-f > span { font: 700 13px var(--cond); letter-spacing: .12em; text-transform: uppercase; color: var(--tinta-2); margin-right: 4px; }
.chip { border: 1px solid var(--linha); background: var(--folha); color: var(--tinta); border-radius: 999px; padding: 6px 13px; font: 500 14px var(--txt); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--azul); border-color: var(--azul); color: #fff; }
select.chip { padding-right: 10px; }
.contagem { color: var(--tinta-2); font-size: 14px; }
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px; margin-top: 18px; }
.card { background: var(--folha); border: 1px solid var(--linha); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.foto { position: relative; aspect-ratio: 16 / 9; background: var(--azul-bg); max-width: 100%; }
.foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
.foto .leg { position: absolute; left: 10px; bottom: 10px; background: rgba(0, 0, 0, .55); color: #fff; font-size: 12px; border-radius: 999px; padding: 3px 10px; }
.foto .ult { position: absolute; right: 10px; top: 10px; background: var(--alerta); color: #fff; font: 700 13px var(--cond); letter-spacing: .06em; text-transform: uppercase; border-radius: 6px; padding: 4px 8px; }
.corpo { padding: 14px 16px 16px; display: grid; gap: 10px; flex: 1; }
.corpo h2 { font: 800 30px/1 var(--cond); margin: 0; color: var(--noite); }
.rota { color: var(--tinta-2); font-size: 14px; }
.voo { font-size: 14px; display: grid; gap: 2px; }
.voo b { font-weight: 600; }
.precos { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px dashed var(--linha); padding-top: 10px; margin-top: auto; }
.google { font-size: 13px; color: var(--tinta-2); }
.google s { font-weight: 600; text-decoration-color: #E1483B; text-decoration-thickness: 2px; }
.preco { font: 800 40px/1 var(--cond); color: var(--azul); }
.preco small { font-size: 20px; margin-right: 3px; }
.det { font-size: 12px; color: var(--tinta-2); }
.parc { font-size: 13px; color: var(--tinta); margin-top: 3px; }
.parc b { font-weight: 700; }
.eco { background: var(--verde-bg); color: var(--verde); font: 700 15px var(--txt); border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
.quero-rot { font: 700 13px var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--tinta-2); text-align: center; }
.quero { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.quero a { display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; background: var(--azul); color: #fff; font-weight: 700; border-radius: 10px; padding: 10px 8px; }
.quero a:hover { background: var(--noite); }
.quero svg { width: 16px; height: 16px; fill: currentColor; flex: none; }
.vazio { padding: 32px; text-align: center; color: var(--tinta-2); }
.rodape { margin-top: 36px; border-top: 1px solid var(--linha); padding-top: 16px; color: var(--tinta-2); font-size: 13px; display: grid; gap: 8px; max-width: 90ch; }
.rodape details summary { cursor: pointer; }
.rodape ul { margin: 6px 0 0; padding-left: 18px; }
@media (max-width: 560px) { .topo img { height: 30px; } .btn-whats small { display: none; } .btn-whats { padding: 7px 11px; font-size: 14px; } }
</style>

<body>
<header class="topo"><div class="in">
  <a href="/" title="Página inicial da Mesquita Turismo"><img src="/passagens-em-oferta/logo.png" alt="Mesquita Turismo"></a>
  <div class="atendentes" id="atendentes"></div>
</div></header>

<main class="pagina">

    <p id="sub"></p>

  <div class="filtros">

        <option value="data">Data da viagem</option>
      </select>
      <span class="contagem tab" id="contagem" style="margin-left:auto"></span>
    </div>
  </div>

  <div class="grade" id="grade"></div>
  <div class="vazio" id="vazio" hidden>Nenhuma passagem com esses filtros.</div>

  <footer class="rodape" id="rodape"></footer>
</main>

const ZAP = '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.2-.7-2.7-1.1-4.4-3.8-4.5-4-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .6l-.4.6-.3.4c.1.2.6 1 1.3 1.6.9.8 1.6 1 1.8 1.1.2.1.4.1.5-.1l.7-.9c.2-.2.4-.2.6-.1l1.9.9c.2.1.4.2.4.3.1.1.1.6-.1 1.2z"/></svg>';
const ATENDENTES = DADOS.atendentes;
const PARCELAS = DADOS.parcelas;
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const NOME_MES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
const nomeMes = (m) => NOME_MES[Number(m.slice(5, 7)) - 1];
// IATA -> { cidade, aeroporto } das origens (painel-passagens.js)
const ORIG = DADOS.origens || {};
const cidadeOrig = (c) => ORIG[c]?.cidade || c;
const rotuloOrig = (c) => (ORIG[c]?.aeroporto ? `${ORIG[c].cidade} · ${ORIG[c].aeroporto}` : cidadeOrig(c));
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const reais = (v) => Math.round(v).toLocaleString('pt-BR');
const dia = (iso) => `${Number(iso.slice(8, 10))} ${MESES[Number(iso.slice(5, 7)) - 1]}`;
const ddmm = (iso) => `${iso.slice(8, 10)}/${iso.slice(5, 7)}`;
const linkWhats = (numero, texto) => `https://wa.me/${numero}?text=${encodeURIComponent(texto)}`;
const centavos = (v) => v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const ofertas = DADOS.ofertas.map((o, i) => ({ ...o, ordem: i, mes: o.ida.slice(0, 7) }));
document.getElementById('atendentes').innerHTML = ATENDENTES.map((a) => `<a class="btn-whats" href="${linkWhats(a.numero, `Olá, ${a.nome}! Vi as passagens em oferta no site da Mesquita Turismo e quero mais informações.`)}" target="_blank" rel="noopener">${ZAP}${esc(a.nome)} <small class="tab">${esc(a.exibicao)}</small></a>`).join('');
document.getElementById('sub').textContent = `${ofertas.length} voos de ${new Set(ofertas.map((o) => o.origem)).size} cidades de origem, de ${(() => { const ms = [...new Set(ofertas.map((o) => o.mes))].sort().map((m) => nomeMes(m).toLowerCase()); return ms.length > 1 ? `${ms.slice(0, -1).join(', ')} e ${ms.at(-1)}` : ms[0]; })()}, com preço por pessoa, ida e volta, já com as taxas, em até ${PARCELAS}x sem juros ou à vista no Pix. Comparados com o menor preço do Google Voos para as mesmas datas, consultado em ${DADOS.consultado}.`;

const estado = { destino: 'todos', mes: 'todos', origem: 'todas' };
function chips(id, chave, opcoes) {
  const el = document.getElementById(id);
  for (const [valor, rotulo] of opcoes) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = rotulo; b.dataset.v = valor;
    b.setAttribute('aria-pressed', String(estado[chave] === valor));
    b.addEventListener('click', () => { estado[chave] = valor; el.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.v === valor))); desenhar(); });
    el.appendChild(b);
  }
}
// Com dezenas de origens e destinos, lista suspensa; o mes continua em botoes.
function lista(id, chave, opcoes) {
  const el = document.getElementById(id);
  el.innerHTML = opcoes.map(([v, r]) => `<option value="${esc(v)}">${esc(r)}</option>`).join('');
  el.addEventListener('change', () => { estado[chave] = el.value; desenhar(); });
}
const porNome = (a, b) => a[1].localeCompare(b[1], 'pt-BR');
const conta = (k, v) => ofertas.filter((o) => o[k] === v).length;
lista('f-origem', 'origem', [['todas', 'Todas as cidades'], ...[...new Set(ofertas.map((o) => o.origem))].map((c) => [c, `${rotuloOrig(c)} (${c}) · ${conta('origem', c)}`]).sort(porNome)]);
lista('f-destino', 'destino', [['todos', 'Todos os destinos'], ...[...new Map(ofertas.map((o) => [o.destino, o.cidade])).entries()].map(([k, v]) => [k, `${v} · ${conta('destino', k)}`]).sort(porNome)]);
chips('f-mes', 'mes', [['todos', 'Todos'], ...[...new Set(ofertas.map((o) => o.mes))].sort().map((m) => [m, nomeMes(m)])]);
// Link direto por cidade: /passagens-em-oferta/?de=POA
const deUrl = new URLSearchParams(location.search).get('de');
if (deUrl && ofertas.some((o) => o.origem === deUrl.toUpperCase())) { estado.origem = deUrl.toUpperCase(); document.getElementById('f-origem').value = estado.origem; }
document.getElementById('ordem').addEventListener('change', desenhar);

function card(o) {
  const foto = DADOS.fotos[o.destino];
  const texto = (nome) => `Olá, ${nome}! Quero a passagem ${cidadeOrig(o.origem)} → ${o.cidade} (${o.origem} → ${o.destino}), ida ${ddmm(o.ida)} e volta ${ddmm(o.volta)}, ${o.cia}, por R$ ${reais(o.preco)} por pessoa (oferta do site).`;
  return `<article class="card">
    <div class="foto">${foto ? `<img src="${esc(foto.arquivo)}" alt="${esc(foto.legenda)}" loading="lazy"><span class="leg">${esc(foto.legenda)}</span>` : ''}${o.lugares <= 9 ? '<span class="ult">Últimos lugares</span>' : ''}</div>
    <div class="corpo">
      <div><h2>${esc(o.cidade)}</h2><div class="rota">Saindo de ${esc(rotuloOrig(o.origem))} (${esc(o.origem)}) → ${esc(o.destino)}</div></div>
      <div class="voo tab"><div><b>${dia(o.ida)} → ${dia(o.volta)}</b> · ${o.noites} noite${o.noites === 1 ? '' : 's'}</div><div>${esc(o.cia)} · ida ${esc(o.idaSai)} → ${esc(o.idaChega)} · volta ${esc(o.voltaSai)} → ${esc(o.voltaChega)}</div></div>
      <div class="precos">
        <div><div class="google">No Google Voos: <s class="tab">R$ ${reais(o.google)}</s></div><div class="preco tab"><small>R$</small>${reais(o.preco)}</div><div class="det">por pessoa · ida e volta com taxas</div><div class="parc tab"><b>${PARCELAS}x de R$ ${centavos(o.preco / PARCELAS)}</b> sem juros ou à vista no Pix</div></div>
        <span class="eco tab">Economize R$ ${reais(o.economia)}</span>
      </div>
      <div class="quero-rot">Quero esta passagem · fale com</div>
      <div class="quero">${ATENDENTES.map((a) => `<a href="${linkWhats(a.numero, texto(a.nome))}" target="_blank" rel="noopener">${ZAP}${esc(a.nome)}</a>`).join('')}</div>
    </div>
  </article>`;
}

function desenhar() {
  const ordem = document.getElementById('ordem').value;
  const filtradas = ofertas.filter((o) => (estado.destino === 'todos' || o.destino === estado.destino) && (estado.mes === 'todos' || o.mes === estado.mes) && (estado.origem === 'todas' || o.origem === estado.origem));
  filtradas.sort({ destaque: (a, b) => a.ordem - b.ordem, economia: (a, b) => b.economia - a.economia, preco: (a, b) => a.preco - b.preco, data: (a, b) => a.ida.localeCompare(b.ida) }[ordem]);
  document.getElementById('grade').innerHTML = filtradas.map(card).join('');
  document.getElementById('vazio').hidden = filtradas.length > 0;
  document.getElementById('contagem').textContent = `${filtradas.length} de ${ofertas.length} voos`;
}
desenhar();

document.getElementById('rodape').innerHTML = `
