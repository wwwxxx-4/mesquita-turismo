body { margin: 0; background: var(--papel); color: var(--tinta); font: 16px/1.5 var(--txt); }

.pagina { max-width: 1160px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; }
.hero h1 { font: 800 clamp(34px, 6vw, 58px)/1 var(--cond); margin: 0; text-wrap: balance; color: var(--noite); }
.hero h1 em { font-style: normal; color: var(--azul); }
.hero p { color: var(--tinta-2); margin: 10px 0 0; max-width: 70ch; }
.selo { display: inline-flex; gap: 6px; align-items: center; background: var(--verde-bg); color: var(--verde); font-weight: 700; font-size: 14px; border-radius: 999px; padding: 5px 12px; margin-top: 12px; }

const ZAP = '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.2-.7-2.7-1.1-4.4-3.8-4.5-4-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .6l-.4.6-.3.4c.1.2.6 1 1.3 1.6.9.8 1.6 1 1.8 1.1.2.1.4.1.5-.1l.7-.9c.2-.2.4-.2.6-.1l1.9.9c.2.1.4.2.4.3.1.1.1.6-.1 1.2z"/></svg>';
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const reais = (v) => Math.round(v).toLocaleString('pt-BR');
const dia = (iso) => `${Number(iso.slice(8, 10))} ${MESES[Number(iso.slice(5, 7)) - 1]} ${iso.slice(2, 4)}`;
const ddmm = (iso) => `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}`;
const linkWhats = (numero, texto) => `https://wa.me/${numero}?text=${encodeURIComponent(texto)}`;
const ATENDENTES = DADOS.atendentes;
const ofertas = DADOS.ofertas;

document.getElementById('atendentes').innerHTML = ATENDENTES.map((a) => `<a class="btn-whats" href="${linkWhats(a.numero, `Olá, ${a.nome}! Vi as promoções de passagens no site da Mesquita Turismo e quero mais informações.`)}" target="_blank" rel="noopener">${ZAP}${esc(a.nome)} <small class="tab">${esc(a.exibicao)}</small></a>`).join('');
const SEM = !!DADOS.semPreco; // pagina so de links: o preco e o que o site mostrar na hora
// Pagina de um destino so: o cartao diz a saida. Varios destinos: o cartao diz o destino.
const UM_DESTINO = !!DADOS.titulo && new Set(DADOS.ofertas.map((o) => o.destino)).size === 1;
const CAL = SEM && !!DADOS.calendario;
const NOME_CIA = { G3: 'Gol', LA: 'Latam', JJ: 'Latam', AD: 'Azul', TP: 'TAP', AR: 'Aerolíneas Argentinas', CM: 'Copa', AV: 'Avianca', IB: 'Iberia', UX: 'Air Europa', AF: 'Air France', KL: 'KLM', AT: 'Royal Air Maroc', CA: 'Air China', BA: 'British Airways', DL: 'Delta', UA: 'United', AA: 'American', ET: 'Ethiopian', EK: 'Emirates', QR: 'Qatar Airways', TK: 'Turkish', LH: 'Lufthansa', LX: 'Swiss', AZ: 'ITA Airways', JA: 'JetSMART', H2: 'Sky', AM: 'Aeroméxico', AC: 'Air Canada', EY: 'Etihad' };
const SITE = !!DADOS.precoSite; // preco do nosso site (com taxas), conferido - 19/10 // ...com o preco pesquisado e o calendario de datas de cada saida
const NOME_MES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
const semana = (iso) => ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'][new Date(iso + 'T12:00:00Z').getUTCDay()];
function calendario(o) {
  if (!o.datas?.length) return '';
  const meses = new Map();
  for (const d of o.datas) { const k = d[0].slice(0, 7); if (!meses.has(k)) meses.set(k, []); meses.get(k).push(d); }
  return `<details class="cal"><summary>📅 Ver datas e preços (${o.datas.length}) <span class="seta">▾</span></summary><div class="dica">Toque no dia para ver os voos no nosso site. <b>✓</b> = preço conferido no nosso site · <b>≈</b> = estimado pelas datas conferidas.</div>${[...meses].map(([k, ds]) => {
    const menor = Math.min(...ds.filter((d) => d[3] !== 0).map((d) => d[2]));
    return `<div class="mes">${NOME_MES[Number(k.slice(5, 7)) - 1]} ${k.slice(0, 4)}</div><div class="dias">${ds.map((d) => `<a href="${esc(o.linkModelo.replace('{IDA}', d[0]).replace('{VOLTA}', d[1]))}" target="_blank" rel="noopener" class="tab${d[2] === menor ? ' barato' : ''}"><span class="cal-dia">${d[4] ? `<img class="logo-cia" src="https://pics.avs.io/100/100/${esc(d[4])}.png" alt="${esc(NOME_CIA[d[4]] || d[4])}" title="${esc(NOME_CIA[d[4]] || d[4])}" loading="lazy">` : ''}${semana(d[0])} ${dia(d[0])} → ${dia(d[1])}</span><b>${d[3] === 0 ? '≈ ' : ''}R$ ${reais(d[2])}${d[3] === 0 ? '' : ' ✓'}</b></a>`).join('')}</div>`;
  }).join('')}</details>`;
}
if (SEM && !CAL) document.getElementById('ordem').options[0].textContent = 'Melhores ofertas';
document.getElementById('sub').textContent = CAL ? `${ofertas.length} cidades de saída com preço por pessoa, ida e volta. Em cada uma, toque em "Ver datas e preços" e escolha o dia para ver os voos no nosso site, ou chame a gente no WhatsApp.` : SEM ? `${ofertas.length} opções de ida e volta, saindo de ${new Set(ofertas.map((o) => o.origem)).size} cidades. Clique em "Ver voos e preços" para abrir a busca com as datas já preenchidas e ver o valor atualizado, ou chame a gente no WhatsApp.` : `${ofertas.length} promoç${ofertas.length === 1 ? 'ão' : 'ões'} de ida e volta, com preço por pessoa já com as taxas. Clique em "Ver voos e comprar" para abrir a busca com as datas já preenchidas, ou chame a gente no WhatsApp.`;
if (DADOS.titulo) document.getElementById('titulo').innerHTML = DADOS.classe === 'executiva'
  ? `Passagens em <em>classe executiva</em> para ${esc(DADOS.titulo)}` : `Passagens para <em>${esc(DADOS.titulo)}</em> em promoção`;
// O que se entendeu do texto da promocao (classe, mala, voos diretos, cia) - 19/10
document.getElementById('destaques').innerHTML = (DADOS.destaques || []).map((d) => `<span${/executiva|premium/i.test(d) ? ' class="forte"' : ''}>${esc(d)}</span>`).join('');
if (DADOS.classe === 'executiva' || DADOS.classe === 'premium') {
  const av = document.getElementById('aviso-classe'); av.hidden = false;
  av.innerHTML = `<b>Preços em ${DADOS.classe === 'executiva' ? 'classe executiva' : 'econômica premium'}.</b> Ao abrir a busca no nosso site, toque em <b>Ordenar e Filtrar</b> → <b>Classes</b> → <b>${DADOS.classe === 'executiva' ? 'Executiva' : 'Econômica premium'}</b> para ver só esses voos, ou chame a gente no WhatsApp que montamos para você.`;
}
if (new Set(ofertas.map((o) => o.destino)).size < 2) document.getElementById('f-destino').hidden = true;
document.getElementById('selo').textContent = SITE ? `✓ Preços do nosso site conferidos em ${DADOS.consultado}` : CAL ? `✓ Preços pesquisados em ${DADOS.consultado}` : SEM ? `✓ Datas selecionadas em ${DADOS.consultado}` : `✓ Preços conferidos em ${DADOS.consultado}`;

const estado = { origem: 'todas', destino: 'todos' };
function chips(id, chave, opcoes) {
  const el = document.getElementById(id);
  for (const [valor, rotulo] of opcoes) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = rotulo; b.dataset.v = valor;
    b.setAttribute('aria-pressed', String(estado[chave] === valor));
    b.addEventListener('click', () => { estado[chave] = valor; el.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.v === valor))); desenhar(); });
    el.appendChild(b);
  }
}
chips('f-origem', 'origem', [['todas', 'Todas'], ...[...new Map(ofertas.map((o) => [o.origem, o.origemNome])).entries()]]);
chips('f-destino', 'destino', [['todos', 'Todos'], ...[...new Map(ofertas.map((o) => [o.destino, o.cidade])).entries()]]);
document.getElementById('ordem').addEventListener('change', desenhar);

function card(o) {
  const texto = (nome) => `Olá, ${nome}! Quero a promoção ${o.origemNome} → ${o.cidade}, ida ${ddmm(o.ida)} e volta ${ddmm(o.volta)}, ${o.cia}${SEM && !CAL ? '' : `, por R$ ${reais(o.preco)} por pessoa`} (promoções do site).`;
  return `<article class="card">
    <div class="faixa">${UM_DESTINO
      ? `<h2>Saindo de ${esc(o.origemNome)}</h2><div class="rota">${esc(o.origem)} → ${esc(o.cidade)} (${esc(o.destino)})</div>`
      : `<h2>${esc(o.cidade)}</h2><div class="rota">saindo de ${esc(o.origemNome)} (${esc(o.origem)}) → ${esc(o.destino)}</div>`}</div>
    <div class="corpo">
      <div class="voo tab"><div><b>${dia(o.ida)} → ${dia(o.volta)}</b> · ${o.noites} dia${o.noites === 1 ? '' : 's'}</div><div>${CAL ? `${o.ciaCod ? `<img class="logo-cia" src="https://pics.avs.io/100/100/${esc(o.ciaCod)}.png" alt="" loading="lazy">` : ''}${esc(o.cia)} · data mais em conta` : SEM ? `${esc(o.cia)} · horários e voos no site` : `${esc(o.cia)} · ida às ${esc(o.idaSai)} · volta às ${esc(o.voltaSai)}`}</div></div>
      ${SEM ? '' : `<div class="tags">${o.direto ? '<span class="tag">Voo direto</span>' : ''}${o.bagagem ? '<span class="tag">Com mala despachada</span>' : '<span class="tag">Bagagem de mão</span>'}</div>`}
      <div class="precos">${CAL ? `<div class="apartir">a partir de${o.estimado ? ' (estimado)' : ''}</div><div class="preco tab"><small>${o.estimado ? '≈ ' : ''}R$</small>${reais(o.preco)}</div><div class="det">${SITE ? 'por pessoa · ida e volta com taxas' : 'por pessoa ida e volta sem taxas*'}</div>` : SEM ? '<div class="det">Preço por pessoa, ida e volta com taxas, atualizado na hora no nosso site</div>' : `<div class="preco tab"><small>R$</small>${reais(o.preco)}</div><div class="det">por pessoa · ida e volta com taxas</div>`}</div>
      ${CAL ? calendario(o) : ''}
      <div class="acoes">
        ${CAL ? '' : `<a class="comprar" href="${esc(o.link)}" target="_blank" rel="noopener">${SEM ? 'Ver voos e preços' : 'Ver voos e comprar'}</a>`}
        <div class="zaps">${ATENDENTES.map((a) => `<a class="zap" href="${linkWhats(a.numero, texto(a.nome))}" target="_blank" rel="noopener">${ZAP}${esc(a.nome)}</a>`).join('')}</div>
      </div>
    </div>
  </article>`;
}

function desenhar() {
  const ordem = document.getElementById('ordem').value;
  const lista = ofertas.filter((o) => (estado.origem === 'todas' || o.origem === estado.origem) && (estado.destino === 'todos' || o.destino === estado.destino));
  lista.sort(ordem === 'data' ? (a, b) => a.ida.localeCompare(b.ida) : (a, b) => (SEM && !CAL ? a.rank - b.rank : a.preco - b.preco));
  document.getElementById('grade').innerHTML = lista.map(card).join('');
  document.getElementById('vazio').hidden = lista.length > 0;
  document.getElementById('contagem').textContent = `${lista.length} de ${ofertas.length}`;
}
desenhar();

// 26/10: datas reconferidas por outro bot depois desta rodada (Supabase, so leitura). A ultima
// conferencia de cada data vale: dentro da margem = preco do site com ✓; sem voo ou acima = sai.
function aplicarConferencias(linhas) {
  const por = new Map(linhas.map((l) => [`${l.origem}-${l.destino}-${l.ida}-${l.volta}`, l]));
  let mudou = 0;
  for (const o of ofertas) {
    if (!o.datas) continue;
    o.datas = o.datas.flatMap((d) => {
      const l = por.get(`${o.origem}-${o.destino}-${d[0]}-${d[1]}`);
      if (!l) return [d];
      mudou++;
      return l.vazio || !l.ok ? [] : [[d[0], d[1], Math.ceil(Number(l.preco_site)), 1, l.cia_iata || d[4]]];
    });
    if (!o.datas.length) continue;
    const conf = o.datas.filter((d) => d[3] === 1);
    const m = (conf.length ? conf : o.datas).reduce((a, b) => (b[2] < a[2] ? b : a));
    Object.assign(o, { ida: m[0], volta: m[1], preco: m[2], estimado: m[3] === 0, ciaCod: m[4] || o.ciaCod, cia: NOME_CIA[m[4]] || o.cia,
      noites: Math.round((new Date(m[1]) - new Date(m[0])) / 864e5) });
  }
  ofertas.splice(0, ofertas.length, ...ofertas.filter((o) => !o.datas || o.datas.length));
  return mudou;
}
if (DADOS.sb && DADOS.slug) {
  fetch(`${DADOS.sb.url}/rest/v1/promocoes_tarifas?select=origem,destino,ida,volta,preco_site,ok,vazio,cia_iata,conferido_em&slug=eq.${encodeURIComponent(DADOS.slug)}&conferido_por=neq.rotina&conferido_em=not.is.null`,
    { headers: { apikey: DADOS.sb.anon, Authorization: `Bearer ${DADOS.sb.anon}` } })
    .then((r) => (r.ok ? r.json() : []))
    .then((linhas) => {
      if (!Array.isArray(linhas) || !aplicarConferencias(linhas)) return;
      desenhar();
      const ult = linhas.map((l) => l.conferido_em).sort().pop();
      const h = new Date(ult).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }).replace(',', ' às');
      document.getElementById('selo').textContent += ` · reconferidos até ${h}`;
    })
    .catch(() => {});
}

document.getElementById('rodape').innerHTML = `
  <div>${SITE ? `Preços do nosso site, por pessoa, ida e volta, com taxas. Os marcados com ✓ foram conferidos no nosso site em ${esc(DADOS.consultado)}; os marcados com ≈ são estimados a partir dessas datas conferidas.` : CAL ? `Preços por pessoa, ida e volta, pesquisados em ${esc(DADOS.consultado)} para as datas mostradas. *Taxas de embarque não incluídas: o valor final, com as taxas, aparece no nosso site na hora da compra.` : SEM ? `Datas selecionadas em ${esc(DADOS.consultado)} entre as mais em conta para cada saída. O preço é o que aparece no nosso site na hora da busca.` : `Preços por pessoa, ida e volta, com taxas, conferidos em ${esc(DADOS.consultado)} para as datas mostradas.`} Passagem aérea muda de preço a qualquer momento: o valor final é o que aparecer na hora da compra. Sujeito a disponibilidade.</div>
  <div>Mesquita Turismo · WhatsApp ${ATENDENTES.map((a) => `${esc(a.nome)} ${esc(a.exibicao)}`).join(' · ')}</div>`;
</script>
