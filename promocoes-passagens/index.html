<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Passagens em Promoção · Mesquita Turismo</title>
<meta name="description" content="Promoções de passagens aéreas ida e volta, atualizadas todo dia, com as datas e os preços pesquisados. Escolha a data e veja os voos no site da Mesquita Turismo.">
<meta property="og:title" content="Passagens em Promoção · Mesquita Turismo">
<meta property="og:description" content="Promoções de passagens aéreas atualizadas todo dia, com datas e preços.">
<meta property="og:image" content="https://www.mesquitaturismo.com.br/passagens-em-oferta/logo.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.mesquitaturismo.com.br/promocoes-passagens/">
<link rel="canonical" href="https://www.mesquitaturismo.com.br/promocoes-passagens/">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/identidade.css">
<style>
/* Vitrine das promocoes de passagem (rotina diaria das 05h). Mesma linguagem
   das paginas de cada promocao: azul do logo, cards brancos sem sombra. A data
   da pesquisa e a informacao mais visivel depois do preco (pedido dele). */
:root {
  --azul: #1072B9; --azul-bg: #EAF5FC; --noite: #0B2440;
  --papel: #F5F8FB; --folha: #FFFFFF; --tinta: #10233B; --tinta-2: #55657C; --linha: #DCE5EE;
  --verde: #138A55; --verde-bg: #E3F5EC; --cinza-bg: #EEF1F4;
  --cond: 'Barlow Condensed', 'Arial Narrow', sans-serif; --txt: 'Barlow', 'Segoe UI', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--papel); color: var(--tinta); font: 16px/1.5 var(--txt); }
a { color: inherit; }
.tab { font-variant-numeric: tabular-nums; }
.topo { position: sticky; top: 0; z-index: 10; background: var(--folha); border-bottom: 1px solid var(--linha); padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px; }
.topo .in { max-width: 1160px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.topo img { height: 44px; display: block; }
.btn-whats { display: inline-flex; align-items: center; gap: 8px; background: #1FAF38; color: #fff; text-decoration: none; font-weight: 700; border-radius: 999px; padding: 8px 14px; white-space: nowrap; font-size: 15px; }
.btn-whats small { font-weight: 500; opacity: .92; }
.btn-whats svg { width: 18px; height: 18px; fill: currentColor; }
.pagina { max-width: 1160px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; }
.hero h1 { font: 800 clamp(34px, 6vw, 58px)/1 var(--cond); margin: 0; color: var(--noite); text-wrap: balance; }
.hero h1 em { font-style: normal; color: var(--azul); }
.hero p { color: var(--tinta-2); margin: 10px 0 0; max-width: 70ch; }
.lista { display: grid; gap: 14px; margin-top: 22px; }
.promo { display: grid; grid-template-columns: 1fr auto; gap: 14px 20px; align-items: center; background: var(--folha); border: 1px solid var(--linha); border-radius: 14px; padding: 16px 18px; text-decoration: none; }
.promo:hover { border-color: var(--azul); }
.promo h2 { font: 800 28px/1.05 var(--cond); margin: 0; color: var(--noite); }
.promo .sub { color: var(--tinta-2); font-size: 14px; margin-top: 4px; }
.pesq { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; background: var(--azul-bg); color: var(--noite); font-weight: 700; font-size: 14px; border-radius: 8px; padding: 5px 10px; }
.status { display: inline-block; margin-left: 6px; font: 700 12px var(--txt); border-radius: 999px; padding: 3px 9px; vertical-align: 2px; }
.status.ativa { background: var(--verde-bg); color: var(--verde); }
.status.encerrada { background: var(--cinza-bg); color: var(--tinta-2); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.tag { background: var(--azul-bg); color: var(--azul); font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 9px; }
.tag.forte { background: #B8860B; color: #fff; }
.preco-box { text-align: right; }
.apartir { font-size: 13px; color: var(--tinta-2); }
.preco { font: 800 40px/1 var(--cond); color: var(--azul); }
.preco small { font-size: 20px; margin-right: 3px; }
.det { font-size: 12px; color: var(--tinta-2); }
.ver { display: inline-block; margin-top: 8px; background: var(--azul); color: #fff; font-weight: 700; border-radius: 10px; padding: 9px 14px; font-size: 15px; }
.promo.velha { opacity: .72; }
.promo.velha .preco { color: var(--tinta-2); }
.promo.velha .ver { background: var(--tinta-2); }
.paginas { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 22px; }
.paginas a { min-width: 40px; text-align: center; text-decoration: none; border: 1px solid var(--linha); background: var(--folha); border-radius: 999px; padding: 6px 12px; font-weight: 600; }
.paginas a[aria-current="page"] { background: var(--azul); border-color: var(--azul); color: #fff; }
.vazio { padding: 32px; text-align: center; color: var(--tinta-2); }
.rodape { margin-top: 36px; border-top: 1px solid var(--linha); padding-top: 16px; color: var(--tinta-2); font-size: 13px; display: grid; gap: 8px; max-width: 90ch; }
@media (max-width: 620px) {
  .topo img { height: 30px; } .btn-whats small { display: none; }
  .promo { grid-template-columns: 1fr; } .preco-box { text-align: left; }
}
</style>
</head>
<body>
<header class="topo"><div class="in">
  <a href="/" title="Página inicial da Mesquita Turismo"><img src="/passagens-em-oferta/logo.png" alt="Mesquita Turismo"></a>
  <div id="atendentes"></div>
</div></header>

<main class="pagina">
  <section class="hero">
    <h1>Passagens em <em>Promoção</em></h1>
    <p id="sub"></p>
  </section>
  <div class="lista" id="lista"></div>
  <nav class="paginas" id="paginas" aria-label="Páginas"></nav>
  <div class="vazio" id="vazio" hidden>Nenhuma promoção por aqui agora. Chame a gente no WhatsApp que cotamos para você.</div>
  <footer class="rodape" id="rodape"></footer>
</main>

<script>
const DADOS = {"promocoes":[{"pasta":"paris-1910","titulo":"Paris","ativa":true,"ateDia":"2026-10-22","encerrada":null,"saidas":19,"aPartirDe":4105,"deSP":{"origem":"São Paulo","preco":4372},"pesquisado":"2026-10-19T15:47:15.536Z","destaques":[],"classe":"economica","precoSite":true},{"pasta":"curitiba-1810","titulo":"Curitiba","ativa":true,"ateDia":"2026-10-21","encerrada":null,"saidas":21,"aPartirDe":538,"deSP":{"origem":"Campinas","preco":538},"pesquisado":"2026-10-19T15:16:32.582Z","destaques":[],"classe":"economica","precoSite":true},{"pasta":"belo-horizonte-1810","titulo":"Belo Horizonte","ativa":true,"ateDia":"2026-10-21","encerrada":null,"saidas":24,"aPartirDe":524,"deSP":{"origem":"São Paulo","preco":524},"pesquisado":"2026-10-19T15:24:51.029Z","destaques":[],"classe":"economica","precoSite":true},{"pasta":"rio-de-janeiro-1810","titulo":"Rio de Janeiro","ativa":true,"ateDia":"2026-10-21","encerrada":null,"saidas":14,"aPartirDe":365,"deSP":{"origem":"São Paulo","preco":473},"pesquisado":"2026-10-19T15:32:05.501Z","destaques":[],"classe":"economica","precoSite":true},{"pasta":"sao-paulo-1910","titulo":"São Paulo","ativa":true,"ateDia":"2026-10-21","encerrada":null,"saidas":15,"aPartirDe":478,"deSP":null,"pesquisado":"2026-10-19T15:40:11.046Z","destaques":[],"classe":"economica","precoSite":true},{"pasta":"uberlandia-e-mais-1710","titulo":"Uberlândia, Ribeirão Preto e mais 21 destinos","ativa":true,"ateDia":"2026-10-20","encerrada":null,"saidas":2,"aPartirDe":416,"deSP":{"origem":"São Paulo","preco":416},"pesquisado":"2026-10-19T14:50:53.655Z","destaques":[],"classe":"economica","precoSite":true},{"pasta":"lisboa-e-mais-1610","titulo":"Lisboa, Barcelona e mais 26 destinos","ativa":true,"ateDia":"2026-10-19","encerrada":null,"saidas":5,"aPartirDe":10037,"deSP":{"origem":"São Paulo","preco":10037},"pesquisado":"2026-10-19T13:27:54.658Z","destaques":["Classe executiva","Com mala despachada"],"classe":"executiva","precoSite":false},{"pasta":"bruxelas-1610","titulo":"Bruxelas","ativa":true,"ateDia":"2026-10-19","encerrada":null,"saidas":15,"aPartirDe":4152,"deSP":{"origem":"São Paulo","preco":4152},"pesquisado":"2026-10-19T14:44:03.921Z","destaques":[],"classe":"economica","precoSite":true},{"pasta":"nova-york-1610","titulo":"Nova York","ativa":true,"ateDia":"2026-10-19","encerrada":null,"saidas":17,"aPartirDe":3335,"deSP":{"origem":"Campinas","preco":4692},"pesquisado":"2026-10-19T13:32:45.498Z","destaques":[],"classe":"economica","precoSite":true},{"pasta":"ilheus-e-mais-1610","titulo":"Ilhéus, Porto Seguro e Salvador","ativa":true,"ateDia":"2026-10-19","encerrada":null,"saidas":15,"aPartirDe":702,"deSP":{"origem":"São Paulo","preco":925},"pesquisado":"2026-10-19T13:41:04.257Z","destaques":[],"classe":"economica","precoSite":true},{"pasta":"milao-1610","titulo":"Milão","ativa":true,"ateDia":"2026-10-19","encerrada":null,"saidas":28,"aPartirDe":4083,"deSP":{"origem":"São Paulo","preco":4696},"pesquisado":"2026-10-19T13:51:29.403Z","destaques":[],"classe":"economica","precoSite":true},{"pasta":"nassau-1610","titulo":"Nassau","ativa":true,"ateDia":"2026-10-19","encerrada":null,"saidas":6,"aPartirDe":3322,"deSP":{"origem":"São Paulo","preco":3322},"pesquisado":"2026-10-19T13:59:43.425Z","destaques":[],"classe":"economica","precoSite":true},{"pasta":"orlando-1610","titulo":"Orlando","ativa":true,"ateDia":"2026-10-19","encerrada":null,"saidas":21,"aPartirDe":2392,"deSP":null,"pesquisado":"2026-10-19T14:02:52.227Z","destaques":[],"classe":"economica","precoSite":true},{"pasta":"santiago-1610","titulo":"Santiago","ativa":true,"ateDia":"2026-10-19","encerrada":null,"saidas":16,"aPartirDe":1866,"deSP":{"origem":"Campinas","preco":2403},"pesquisado":"2026-10-19T13:26:23.397Z","destaques":[],"classe":"economica","precoSite":true},{"pasta":"porto-e-lisboa-1510","titulo":"Porto e Lisboa","ativa":false,"ateDia":"2026-10-18","encerrada":"2026-10-18","saidas":20,"aPartirDe":3745,"deSP":{"origem":"São Paulo","preco":3777},"pesquisado":"2026-10-19T13:15:41.226Z","destaques":[],"classe":"economica","precoSite":true},{"pasta":"palmas-1410","titulo":"Palmas","ativa":false,"ateDia":"2026-10-17","encerrada":"2026-10-17","saidas":18,"aPartirDe":581,"deSP":{"origem":"São Paulo","preco":661},"pesquisado":"2026-10-17T02:36:35.902Z","destaques":[],"classe":"economica","precoSite":false},{"pasta":"curitiba-e-mais-1410","titulo":"Curitiba, Belo Horizonte e mais 23 destinos","ativa":false,"ateDia":"2026-10-14","encerrada":"2026-10-14","saidas":2,"aPartirDe":250,"deSP":{"origem":"São Paulo","preco":250},"pesquisado":"2026-10-15T02:01:35.124Z","destaques":[],"classe":"economica","precoSite":false},{"pasta":"lisboa-e-mais-1510","titulo":"Lisboa, Porto e mais 16 destinos","ativa":false,"ateDia":"2026-10-17","encerrada":"2026-10-17","saidas":4,"aPartirDe":3338,"deSP":null,"pesquisado":"2026-10-17T03:11:47.161Z","destaques":[],"classe":"economica","precoSite":false},{"pasta":"buenos-aires","titulo":"Buenos Aires","ativa":false,"ateDia":"2026-10-17","encerrada":"2026-10-17","saidas":23,"aPartirDe":1324,"deSP":{"origem":"São Paulo","preco":1324},"pesquisado":"2026-10-17T02:05:42.745Z","destaques":[],"classe":"economica","precoSite":false},{"pasta":"miami-e-fort-lauderdale-1510","titulo":"Miami e Fort Lauderdale","ativa":false,"ateDia":"2026-10-17","encerrada":"2026-10-17","saidas":21,"aPartirDe":1977,"deSP":{"origem":"São Paulo","preco":2890},"pesquisado":"2026-10-17T04:03:55.065Z","destaques":[],"classe":"economica","precoSite":false},{"pasta":"madri-1410","titulo":"Madri","ativa":false,"ateDia":"2026-10-17","encerrada":"2026-10-17","saidas":40,"aPartirDe":2783,"deSP":{"origem":"São Paulo","preco":3184},"pesquisado":"2026-10-17T02:25:55.547Z","destaques":["Voos diretos"],"classe":"economica","precoSite":false},{"pasta":"madri","titulo":"Madri","ativa":false,"ateDia":"2026-10-09","encerrada":"2026-10-09","saidas":10,"aPartirDe":3000,"deSP":{"origem":"São Paulo","preco":3461},"pesquisado":"2026-10-06T10:01:14.967Z","destaques":["Voos diretos","Voos da Azul"],"classe":"economica","precoSite":false}],"atendentes":[{"nome":"Wester","numero":"5511953967095","exibicao":"(11) 95396-7095"}]};
const POR_PAGINA = 10;
const ZAP = '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.2-.7-2.7-1.1-4.4-3.8-4.5-4-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .6l-.4.6-.3.4c.1.2.6 1 1.3 1.6.9.8 1.6 1 1.8 1.1.2.1.4.1.5-.1l.7-.9c.2-.2.4-.2.6-.1l1.9.9c.2.1.4.2.4.3.1.1.1.6-.1 1.2z"/></svg>';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const reais = (v) => Math.round(v).toLocaleString('pt-BR');
const dataHora = (iso) => new Date(iso).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }).replace(',', ' às');
const dataCurta = (iso) => new Date(iso + 'T12:00:00Z').toLocaleDateString('pt-BR', { timeZone: 'UTC', day: '2-digit', month: '2-digit' });
const linkWhats = (n, t) => `https://wa.me/${n}?text=${encodeURIComponent(t)}`;

document.getElementById('atendentes').innerHTML = DADOS.atendentes.map((a) => `<a class="btn-whats" href="${linkWhats(a.numero, `Olá, ${a.nome}! Vi as passagens em promoção no site da Mesquita Turismo e quero mais informações.`)}" target="_blank" rel="noopener">${ZAP}${esc(a.nome)} <small class="tab">${esc(a.exibicao)}</small></a>`).join('');
const promos = DADOS.promocoes; // ja vem da mais nova para a mais antiga
const ativas = promos.filter((p) => p.ativa).length;
document.getElementById('sub').textContent = `Promoções de passagens aéreas ida e volta, atualizadas todo dia de manhã. ${ativas ? `${ativas} ativa${ativas === 1 ? '' : 's'} agora. ` : ''}Em cada uma você vê todas as datas com preço e escolhe o dia para ver os voos no nosso site.`;

const total = Math.max(1, Math.ceil(promos.length / POR_PAGINA));
const pagina = Math.min(total, Math.max(1, Number(new URLSearchParams(location.search).get('pagina')) || 1));
const lista = promos.slice((pagina - 1) * POR_PAGINA, pagina * POR_PAGINA);
document.getElementById('lista').innerHTML = lista.map((p) => `
  <a class="promo${p.ativa ? '' : ' velha'}" href="/promocoes-passagens/${esc(p.pasta)}/">
    <div>
      <h2>${p.classe === 'executiva' ? 'Passagens em classe executiva para ' : 'Passagens para '}${esc(p.titulo)}${p.ativa ? '' : `<span class="status encerrada">Encerrada em ${dataCurta(p.encerrada)}</span>`}</h2>
      ${(p.destaques || []).length ? `<div class="tags">${p.destaques.map((d) => `<span class="tag${/executiva|premium/i.test(d) ? ' forte' : ''}">${esc(d)}</span>`).join('')}</div>` : ''}
      <div class="sub">${p.saidas} cidade${p.saidas === 1 ? '' : 's'} de saída${p.deSP ? ` · de ${esc(p.deSP.origem)} a partir de R$ ${reais(p.deSP.preco)}` : ''}</div>
      <div class="pesq tab">🔎 ${p.precoSite ? 'Preços do nosso site conferidos em' : 'Preços pesquisados em'} ${dataHora(p.pesquisado)}</div>
    </div>
    <div class="preco-box">
      <div class="apartir">${p.ativa ? 'a partir de' : 'era a partir de'}</div>
      <div class="preco tab"><small>R$</small>${reais(p.aPartirDe)}</div>
      <div class="det">${p.precoSite ? 'por pessoa · ida e volta com taxas' : 'por pessoa ida e volta sem taxas*'}</div>
      <span class="ver">${p.ativa ? 'Ver datas e preços' : 'Ver como estava'}</span>
    </div>
  </a>`).join('');
document.getElementById('vazio').hidden = promos.length > 0;
document.getElementById('paginas').innerHTML = total < 2 ? '' : Array.from({ length: total }, (_, i) => i + 1)
  .map((n) => `<a href="?pagina=${n}"${n === pagina ? ' aria-current="page"' : ''}>${n}</a>`).join('');
document.getElementById('rodape').innerHTML = `
  <div>Cada promoção fica ativa por até 4 dias e tem os preços pesquisados de novo todo dia de manhã; depois disso fica aqui como encerrada, com a data da última pesquisa. Promoção de "só hoje" vale apenas no dia em que saiu.</div>
  <div>Preços por pessoa, ida e volta, na data e hora da pesquisa. Onde diz "preços do nosso site", o valor já tem as taxas e foi conferido no nosso site de compra. Nos demais, *taxas de embarque não incluídas: o valor final, com as taxas, aparece no nosso site na hora da compra. Passagem aérea muda de preço a qualquer momento: o valor final é o que aparecer na hora da compra. Sujeito a disponibilidade.</div>
  <div>Mesquita Turismo · WhatsApp ${DADOS.atendentes.map((a) => `${esc(a.nome)} ${esc(a.exibicao)}`).join(' · ')}</div>`;
</script>
</body>
</html>
